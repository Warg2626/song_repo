<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <center>
        <h1>Login</h1>
    </center>

    <form name="Authorization"><!--style="margin: 50px;"-->
      
        <fieldset>
            <legend>Authorization</legend>
            <table align="center"> 
              
                    <tr>
                        <td><label for="login">Login</label></td>
                        <td><input type="email" id="login" placeholder="user@user.com"></td>
                    </tr>
              
                    <tr>
                    
                        <td><label for="password">Password</label></td>
                        <td> <input type="password" id="password" placeholder="password"></td>
                    </tr>

                    <tr>
                        
                      <td><td><input type="submit" value="Submit"></td></td>
                        
                    </tr>
            </table>
        </fieldset>
   </form>
  
</body>
</html>
