<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Layout</title>
</head>
<body>

<table border="1" width="100%" cellspacing="0" cellpadding="10">
    <tr>
        <td colspan="2">Title A</td>
        <td rowspan="2" colspan="2">
            <table border="1" width="100%" cellspacing="0" cellpadding="5">
                <tr>
                    <th>Item / Desc.</th>
                    <th>Qty.</th>
                    <th>@</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td>Paperclips (Box)</td>
                    <td>100</td>
                    <td>1.15</td>
                    <td>115.00</td>
                </tr>
                <tr>
                    <td>Paper (Case)</td>
                    <td>10</td>
                    <td>45.99</td>
                    <td>459.90</td>
                </tr>
                <tr>
                    <td>Wastepaper Baskets</td>
                    <td>2</td>
                    <td>17.99</td>
                    <td>35.98</td>
                </tr>
                <tr>
                    <td colspan="3">Subtotal</td>
                    <td>610.88</td>
                </tr>
                <tr>
                    <td colspan="3">Tax 7%</td>
                    <td>42.76</td>
                </tr>
                <tr>
                    <td colspan="3">Total</td>
                    <td>653.64</td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td colspan="2">Title B</td>
    </tr>
    <tr>
        <td rowspan="2">Title D</td>
        <td>Title E</td>
        <td colspan="2" rowspan="2">
            <table border="1" width="100%" cellspacing="0" cellpadding="10">
                <tr>
                    <td>Title F</td>
                    <td>Title G</td>
                    <td>Title H</td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
